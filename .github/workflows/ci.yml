name: ci

on:
  push:
  pull_request:

jobs:
  verilator:
    runs-on: ubuntu-24.04
    container: verilator/verilator:v5.052
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain check (Verilator covergroups)
        run: bash flow/tools/check_verilator.sh
      - name: Block and SoC checks (lint, CDC FIFO, register slice, crossbar, firmware on soc_top)
        run: make -C dv
        env:
          SEEDS: "3"
          N: "1000"
